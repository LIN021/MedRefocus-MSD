[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medrefocus-msd"
version = "0.1.0"
description = "Active local re-observation for missed-tumor recovery on MSD Pancreas"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "MedRefocus contributors"}]
dependencies = [
  "numpy>=1.24,<2", "pandas>=2,<3", "scipy>=1.10,<2",
  "torch>=2.1,<3", "scikit-learn>=1.3,<2", "SimpleITK>=2.3,<3",
  "surface-distance==0.1", "joblib>=1.3,<2", "PyYAML>=6,<7"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9", "build>=1"]

[project.scripts]
medrefocus = "medrefocus.cli:main"

[project.urls]
Repository = "https://github.com/LIN021/MedRefocus-MSD"
Issues = "https://github.com/LIN021/MedRefocus-MSD/issues"

[tool.setuptools.packages.find]
include = ["medrefocus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
